name: Darmaltoon website checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify language, SEO, links and lightweight budgets
        run: python scripts/check_site.py
      - name: Verify approved ZIP layouts
        run: python scripts/check_approved_ui.py
