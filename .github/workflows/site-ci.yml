name: Darmaltoon website checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify language, SEO, links and lightweight budgets
        run: python scripts/check_site.py
      - name: Verify approved ZIP layouts
        run: python scripts/check_approved_ui.py
      - name: Verify new SEO content and AI analytics
        run: python scripts/check_seo_aio.py
      - name: AI referral classifier regression
        run: node scripts/check_ai_referrals.js
      - name: Verify GA4 load and privacy exclusions
        run: node scripts/check_ga4.js
      - name: Validate the unified demo/trial form and safe server-side intake
        run: python scripts/check_unified_trial.py
      - name: Verify canonical Laravel API mount isolates marketing PHP
        run: python scripts/check_apex_api_route.py
      - name: PHP syntax checks for the website and private sync scripts
        run: |
          find api scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax checks for form and live-offer UI
        run: |
          node --check assets/js/forms.js
          node --check assets/js/founding-offer.js
          node --check assets/js/translations.js
